[tools]
rust = "stable"

[tasks]
description = "Parcera Project Tasks"

[tasks.dev]
description = "Start dev (Vite + Rust + Python sidecar). All-in-one."
env = { RUST_LOG = "info" }
run = "ui/node_modules/.bin/tauri dev --config src-tauri/tauri.dev.conf.json"

[tasks.build]
description = "Build Tauri app (production) and copy DMG/app to releases/"
run = """
ui/node_modules/.bin/tauri build
mkdir -p releases
cp src-tauri/target/release/bundle/dmg/*.dmg releases/ 2>/dev/null || true
cp -r "src-tauri/target/release/bundle/macos/Parcera.app" releases/ 2>/dev/null || true
echo "Build artifacts copied to releases/"
ls releases/
"""

[tasks.package]
description = "Package distributable DMG (prepare Python sidecar → tauri build)"
run = """
bash scripts/prepare_sidecar.sh
mise run build
"""

[tasks.server]
description = "Start Python server standalone (for debugging)"
run = """
export PARCERA_CONFIG_PATH="configs/settings.default.yaml"
.venv/bin/python src/run_server.py
"""
