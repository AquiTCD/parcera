[tools]
rust = "stable"

[tasks]
description = "Parcera Project Tasks"

[tasks.dev]
description = "Start Electron dev server (Frontend)"
run = "cd electron && pnpm dev"

[tasks.build]
description = "Build Electron frontend"
run = "cd electron && pnpm build"

[tasks.package]
description = "Package as macOS DMG (unsigned)"
run = """
bash scripts/prepare_sidecar.sh
cd electron && pnpm build && npx electron-builder --mac --arm64 -c.mac.identity=null
"""

[tasks.server]
description = "Start Python server standalone (for debugging)"
run = """
export PARCERA_CONFIG_PATH="configs/settings.default.yaml"
.venv/bin/python src/run_server.py
"""

[tasks.tauri-dev]
description = "Start Tauri dev (Vite + Rust + Python sidecar). All-in-one."
run = "electron/node_modules/.bin/tauri dev"

[tasks.tauri-build]
description = "Build Tauri app (production)"
run = "electron/node_modules/.bin/tauri build"
