# General Application Settings
# ==========================================
verbose: false         # Show detailed debug logs
profile_mode: false    # Enable performance logging ([PERF]) to measure latency
log_level: "INFO"      # Logging level: DEBUG, INFO, WARNING (Includes INFO), ERROR
merge_request_threshold: 0.6  # [Seconds] Wait time after STT before LLM starts. Combined with VAD silence, defines total gap.
response_sensitivity: "medium"  # "high" | "medium" | "low" - Controls how often AI responds to non-keyword speech
force_keywords:       # AI will always respond if these keywords are detected
  - パルセラ
  - Parcera
  - 教えて

# ==========================================
# LLM (Large Language Model) Settings
# ==========================================
llm:
  provider: "gemini" # Active Provider: "gemini", "openai" (Future), "claude" (Future)

  providers:
    gemini:
      model: "gemini-2.0-flash"
      temperature: 1.0  # Creativity (0.0 - 2.0). Default 1.0 is recommended for Gemini 2.0.
      persist_history: false # Save local history to keep memories. Warning: longer history increases token cost and latency.
      option_split_threshold: 15  # [Chars] Heuristic to split sentences for faster TTS streaming.

    openai:
      model: "gpt-4o"
      temperature: 1.0  # Creativity (0.0 - 2.0). OpenAI default is 1.0.

# ==========================================
# STT (Speech to Text) Settings
# ==========================================
stt:
  provider: "faster_whisper" # Active Provider: "faster_whisper", "google", "azure"

  providers:
    faster_whisper:
      model: "longisland3/kotoba-whisper-v2.2-faster" # HuggingFace model path
      device: "cpu"       # Computation device: "cuda" (NVIDIA GPU) or "cpu"
      compute_type: "int8" # Quantization: "float16" (GPU only) or "int8" (CPU friendly/Local recommended)
      whisper_vad_filter: false # Use Whisper's internal VAD. Recommended for long speech, but may skip short phrases.

# ==========================================
# TTS (Text to Speech) Settings
# ==========================================
tts:
  provider: "aivisspeech" # Active Provider: "voicevox", "aivisspeech", "google"

  # Common settings applied to compatible engines (Voicevox-based)
  settings:
    speedScale: 1.25       # Speech speed. Adjusted to match current user setting.
    intonationScale: 0.7 # Intonation variance (0.0 - 2.0). 0 for monotonic, higher for expressive melody.
    volumeScale: 0.50      # Output volume (Range: 0.0 - 1.0, Default: 0.5)
    prePhonemeLength: 0.0  # [Seconds] Silence before speech
    postPhonemeLength: 0.20 # [Seconds] Silence after speech

  providers:
    # AivisSpeech (Local App)
    aivisspeech:
      api_url: "http://127.0.0.1:10101"
      engine_path: "/Applications/AivisSpeech.app/Contents/Resources/AivisSpeech-Engine/run"
      # speaker_id: 888753760 # Anneli
      style_id: 345585728 # るな

    # VOICEVOX (Local App)
    voicevox:
      api_url: "http://127.0.0.1:50021"
      engine_path: "/Applications/VOICEVOX.app/Contents/Resources/vv-engine/run"
      # speaker_id: 3 # ずんだもん (Standard)
      speaker_id: 90 # ぞん子

    # Google Cloud TTS
    google:
      language: "ja-JP"
      voice: "ja-JP-Neural2-B" # (Neural2) A:LowKey, B:StandardFemale, C:StandardMale, D:StandardMale
      speaking_rate: 1.0 # Google Cloud TTS native speed default is 1.0.
      pitch: 0.0          # (-20.0 - 20.0). Default is 0.0.
      volume_gain_db: 0.0 # (-96.0 - 16.0). Default is 0.0.

# ==========================================
# VAD (Voice Activity Detection) Settings
# ==========================================
vad:
  volume_db_threshold: -20.0 # [dB] Sensitivity. Adjusted for noise; higher values make it less sensitive.
  silence_duration_threshold: 0.4 # [Seconds] Shorter is faster, but may segment sentences. (Response tempo gate 1)
  max_duration: 15.0 # [Seconds] Safety cutoff to stop recording in noisy environments.

# ==========================================
# Electron Application Settings
# ==========================================
electron:
  port: 8676 # WebSocket Server Port. Changing this requires an app restart.
  ai_audio_sample_rate: 16000  # [Hz] Must match TTS engine output sample rate used in Python.
  windows:
    ai: { width: 400, height: 400, x: 400, y: 0, alwaysOnTop: true, locked: false }
    user: { width: 400, height: 400, x: 0, y: 0, alwaysOnTop: true, locked: true }

# ==========================================
# Avatar Visual Definitions
# ==========================================
avatars:
  show_debug: true       # Show VAD status / Volume bars overlay
  blink_interval_min: 5000 # [ms] Minimum time between blinks
  blink_interval_max: 15000 # [ms] Maximum time between blinks
  mouth_hold_time: 120    # [ms] Minimum duration to hold a mouth shape (prevents flickering)
  breathe_scale: 1.005    # Scaling width for breathing animation (1.0 = no animation)
  breathe_amplitude: 2    # [px] Vertical movement width for breathing
  breathe_duration: 5000  # [ms] Reference period for one breath cycle
  user:
    name: "User"
    assets_dir: "/assets/user"
  ai:
    name: "AI"
    assets_dir: "/assets/ai"
