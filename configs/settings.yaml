# General Application Settings
verbose: false
log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
merge_request_threshold: 1.5  # Seconds to merge consecutive requests (reduced from 3.0 to prevent over-merging)
response_sensitivity: "medium"  # "high" | "medium" | "low" - Controls how often AI responds to non-keyword speech
force_keywords:
  - パルセラ
  - Parcera
  - 教えて

# LLM Settings
llm_model: "gemini-2.5-flash"
llm_temperature: 0.7
option_split_threshold: 15  # Tuning for faster response (reduced from 20 for shorter replies)

# TTS Engine Selection: ["aivisspeech", "voicevox"]
# You can change this to "aivisspeech" to use AivisSpeech.
active_engine: "aivisspeech"

# Engine Configurations
engines:
  aivisspeech:
    api_url: "http://127.0.0.1:10101"
    engine_path: "/Applications/AivisSpeech.app/Contents/Resources/AivisSpeech-Engine/run"
    # speaker_id: 888753760 # Anneli
    style_id: 345585728 # るな

  voicevox:
    api_url: "http://127.0.0.1:50021"
    engine_path: "/Applications/VOICEVOX.app/Contents/Resources/vv-engine/run"
    # speaker_id: 3 # ずんだもん (Standard)
    speaker_id: 90 # ぞん子

# TTS Common Parameters (Fine-tuning)
tts_settings:
  speedScale: 1.25
  tempoDynamicScale: 0.7
  volumeScale: 0.50
  prePhonemeLength: 0
  postPhonemeLength: 0.20

# VAD (Voice Activity Detection) Settings
# volume_db_threshold: Single source of truth for audio sensitivity (dB).
# Used by both Python VAD (speech recognition) and JS lip-sync (mouth movement).
# JS conversion: RMS×100 = 10^(dB/20) × 100  (-20dB → 10.0)
vad:
  whisper_vad_filter: false  # Use Faster-Whisepr's internal VAD filter? (False = catch short utterances)
  volume_db_threshold: -20.0
  silence_duration_threshold: 0.6 # Seconds of silence to consider speech ended (Lower = faster response)
  max_duration: 15.0

# Electron Application Settings
electron:
  port: 8080
  ai_audio_sample_rate: 16000  # Hz — must match TTS engine output sample rate
  windows:
    ai: { width: 400, height: 400, alwaysOnTop: true }
    user: { width: 400, height: 400, alwaysOnTop: true }

# Avatar Visual Definitions
avatars:
  show_debug: true
  blink_interval_min: 5000 # ms
  blink_interval_max: 15000 # ms
  mouth_hold_time: 120    # ms
  breathe_scale: 1.005     # Scale factor for breathing animation (subtle expansion)
  breathe_amplitude: 2     # Vertical movement in pixels
  breathe_duration: 5000   # Duration of one breath cycle in ms (5s is natural)
  user:
    name: "User"
    assets_dir: "/assets/user"
  ai:
    name: "AI"
    assets_dir: "/assets/ai"
