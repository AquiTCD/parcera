name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            sidecar_script: bash scripts/prepare_sidecar.sh
          - os: windows-latest
            sidecar_script: pwsh scripts/prepare_sidecar.ps1

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm -C ui install

      - name: Add pnpm binaries to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/ui/node_modules/.bin" >> $GITHUB_PATH

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Prepare Python sidecar
        run: ${{ matrix.sidecar_script }}

      - name: Build Tauri app
        run: tauri build

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: parcera-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: parcera-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
